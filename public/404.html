<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Maamitta</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #faf9f6;
        color: #141a18;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      }
      .card {
        width: 100%;
        max-width: 400px;
        background: #ffffff;
        border: 1px solid rgba(20, 26, 24, 0.1);
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 8px 24px rgba(20, 26, 24, 0.08);
        text-align: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #184e3b;
      }
      .code {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #6e7b76;
        margin-bottom: 6px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 22px;
        font-size: 14px;
        line-height: 1.5;
        color: #4a5551;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 44px;
        padding: 0 22px;
        border-radius: 10px;
        background: #184e3b;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 2px 5px rgba(24, 78, 59, 0.24);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <svg width="36" height="36" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="#184E3B"/>
          <path d="M5 9C5 6.79 6.79 5 9 5H17.5L13.5 19.5H5V9Z" fill="#FFFFFF"/>
          <path d="M20.5 5H23C25.21 5 27 6.79 27 9V14.5H17.9L20.5 5Z" fill="#FFFFFF" fill-opacity="0.38"/>
          <path d="M17.1 17.5H27V23C27 25.21 25.21 27 23 27H14.5L17.1 17.5Z" fill="#FFFFFF" fill-opacity="0.62"/>
          <path d="M5 22.5H12.7L11.5 27H9C6.79 27 5 25.21 5 23V22.5Z" fill="#7DD3FC"/>
        </svg>
        <span>Maamitta</span>
      </div>
      <div class="code">404</div>
      <h1>Sivua ei löytynyt</h1>
      <p>Hakemaasi osoitetta ei ole olemassa. Palaa kartalle mittaamaan tontteja ja laskemaan materiaaleja.</p>
      <a href="/">Palaa kartalle</a>
    </main>
  </body>
</html>
